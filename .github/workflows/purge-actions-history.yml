name: Purge all Actions history

on:
  push:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Delete every previous Actions run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t run_ids < <(
            gh api --paginate "/repos/${REPOSITORY}/actions/runs?per_page=100" --jq '.workflow_runs[].id'
          )

          echo "Found ${#run_ids[@]} run records."

          for run_id in "${run_ids[@]}"; do
            if [[ "${run_id}" == "${CURRENT_RUN_ID}" ]]; then
              continue
            fi

            deleted=0
            for delay in 1 2 5 10 20; do
              if gh api --method DELETE "/repos/${REPOSITORY}/actions/runs/${run_id}" >/dev/null 2>&1; then
                deleted=1
                break
              fi
              sleep "${delay}"
            done

            if [[ "${deleted}" -ne 1 ]]; then
              echo "Could not delete run ${run_id}" >&2
              exit 1
            fi

            sleep 0.15
          done

      - name: Remove this temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_PATH: .github/workflows/purge-actions-history.yml
        shell: bash
        run: |
          set -euo pipefail
          workflow_sha="$(gh api "/repos/${REPOSITORY}/contents/${WORKFLOW_PATH}" --jq '.sha')"
          gh api --method DELETE "/repos/${REPOSITORY}/contents/${WORKFLOW_PATH}" \
            -f message='Remove temporary Actions history purger' \
            -f sha="${workflow_sha}" \
            -f branch='main' >/dev/null

      - name: Delete this cleanup run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          gh api --method DELETE "/repos/${REPOSITORY}/actions/runs/${CURRENT_RUN_ID}" >/dev/null
