name: Camera360 V7 Dedicated Oracle Relay

on:
  push:
    branches: [camera-v7-public-relay]
    paths:
      - 'camera-v7/oracle/dedicated-relay-userdata.sh'
      - '.github/workflows/camera-v7-oracle-relay.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: 'True'

jobs:
  provision_relay:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Checkout V7 source
        uses: actions/checkout@v4
        with:
          ref: camera-v7-public-relay
          persist-credentials: false

      - name: Validate dedicated relay source
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n camera-v7/oracle/dedicated-relay-userdata.sh
          grep -F 'CAMERA_V7_RELAY_READY=1' camera-v7/oracle/dedicated-relay-userdata.sh
          grep -F '4x7fSYEdJpvpdnzIrj3dm/xky2e8Pcv/Yh1b/5Hh3Ro=' camera-v7/oracle/dedicated-relay-userdata.sh
          echo CAMERA_V7_DEDICATED_SOURCE_PASS

      - name: Configure OCI API credentials
        shell: bash
        env:
          OCI_PRIVATE_KEY_PEM: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_FINGERPRINT_VALUE: ${{ secrets.OCI_FINGERPRINT }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$HOME/.oci"
          python3 - <<'PY'
          import os
          from pathlib import Path
          value=os.environ.get('OCI_PRIVATE_KEY_PEM','').strip()
          if len(value)>=2 and value[0]==value[-1] and value[0] in {'"', "'"}:
              value=value[1:-1]
          if '\\n' in value and '\n' not in value:
              value=value.replace('\\r','').replace('\\n','\n')
          Path.home().joinpath('.oci/oci_api_key.pem').write_text(value.replace('\r','').strip()+'\n',encoding='utf-8')
          PY
          chmod 600 "$HOME/.oci/oci_api_key.pem"
          FINGERPRINT="$(printf '%s' "$OCI_FINGERPRINT_VALUE" | tr -d '[:space:]')"
          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=$FINGERPRINT
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ vars.OCI_REGION }}
          key_file=$HOME/.oci/oci_api_key.pem
          EOF
          chmod 600 "$HOME/.oci/config"

      - name: Install OCI CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          pipx install oci-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Resolve compartment and existing public subnet
        shell: bash
        env:
          TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          CONFIGURED_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
        run: |
          set -Eeuo pipefail
          COMPARTMENT="$CONFIGURED_COMPARTMENT_OCID"
          if [[ ! "$COMPARTMENT" =~ ^ocid1\.compartment\. ]]; then
            COMPARTMENT="$(oci iam compartment list --compartment-id "$TENANCY_OCID" --compartment-id-in-subtree true --access-level ANY --all --output json | jq -r '[.data[] | select(.name=="NituWAGateway" and .["lifecycle-state"]=="ACTIVE") | .id][0] // empty')"
          fi
          [[ "$COMPARTMENT" =~ ^ocid1\.compartment\. ]] || { echo 'Unable to resolve compartment' >&2; exit 2; }
          INSTANCES="$(oci compute instance list --compartment-id "$COMPARTMENT" --lifecycle-state RUNNING --all --output json)"
          BASE_INSTANCE="$(jq -r '[.data[] | select((.["display-name"]|test("NituTravelsWAHA|nitu-whatsapp-gateway";"i")))] | sort_by(.["time-created"]) | last | .id // empty' <<<"$INSTANCES")"
          [[ "$BASE_INSTANCE" =~ ^ocid1\.instance\. ]] || { echo 'Existing gateway instance not found' >&2; exit 2; }
          BASE_VNIC="$(oci compute vnic-attachment list --compartment-id "$COMPARTMENT" --instance-id "$BASE_INSTANCE" --all --output json | jq -r '[.data[] | select(.["lifecycle-state"]=="ATTACHED")][0].["vnic-id"] // empty')"
          BASE_VNIC_JSON="$(oci network vnic get --vnic-id "$BASE_VNIC" --output json)"
          SUBNET="$(jq -r '.data.["subnet-id"]' <<<"$BASE_VNIC_JSON")"
          VCN="$(oci network subnet get --subnet-id "$SUBNET" --query 'data."vcn-id"' --raw-output)"
          echo "OCI_V7_COMPARTMENT=$COMPARTMENT" >> "$GITHUB_ENV"
          echo "OCI_V7_SUBNET=$SUBNET" >> "$GITHUB_ENV"
          echo "OCI_V7_VCN=$VCN" >> "$GITHUB_ENV"
          echo "OCI_V7_BASE_VNIC=$BASE_VNIC" >> "$GITHUB_ENV"
          echo CAMERA_V7_NETWORK_RESOLVE_PASS

      - name: Create dedicated relay NSG
        shell: bash
        run: |
          set -Eeuo pipefail
          NSG="$(oci network nsg list --compartment-id "$OCI_V7_COMPARTMENT" --vcn-id "$OCI_V7_VCN" --all --output json | jq -r '[.data[] | select(.["display-name"]=="nitu-camera-v7-dedicated")][0].id // empty')"
          if [[ ! "$NSG" =~ ^ocid1\.networksecuritygroup\. ]]; then
            NSG="$(oci network nsg create --compartment-id "$OCI_V7_COMPARTMENT" --vcn-id "$OCI_V7_VCN" --display-name nitu-camera-v7-dedicated --query data.id --raw-output)"
          fi
          RULES="$(oci network nsg rules list --nsg-id "$NSG" --all --output json)"
          if ! jq -e '.data[] | select(.direction=="INGRESS" and .protocol=="17") | (.["udp-options"] // {}) | (.["destination-port-range"] // {}) | select((.min // 0) <= 51828 and (.max // 0) >= 51829)' <<<"$RULES" >/dev/null; then
            cat >/tmp/v7-rules.json <<'JSON'
          [{"direction":"INGRESS","protocol":"17","source":"0.0.0.0/0","sourceType":"CIDR_BLOCK","isStateless":false,"udpOptions":{"destinationPortRange":{"min":51828,"max":51829}},"description":"Camera360 V7 WireGuard relay"}]
          JSON
            oci network nsg rules add --nsg-id "$NSG" --security-rules file:///tmp/v7-rules.json >/dev/null
          fi
          echo "OCI_V7_NSG=$NSG" >> "$GITHUB_ENV"
          echo CAMERA_V7_DEDICATED_NSG_PASS

      - name: Launch or reuse dedicated relay instance
        shell: bash
        run: |
          set -Eeuo pipefail
          ALL="$(oci compute instance list --compartment-id "$OCI_V7_COMPARTMENT" --all --output json)"
          INSTANCE="$(jq -r '[.data[] | select(.["display-name"]=="nitu-camera-v7-relay" and .["lifecycle-state"]!="TERMINATED")] | sort_by(.["time-created"]) | last | .id // empty' <<<"$ALL")"
          if [[ "$INSTANCE" =~ ^ocid1\.instance\. ]]; then
            STATE="$(oci compute instance get --instance-id "$INSTANCE" --query 'data."lifecycle-state"' --raw-output)"
            if [ "$STATE" = STOPPED ]; then
              oci compute instance action --instance-id "$INSTANCE" --action START --wait-for-state RUNNING >/dev/null
            fi
          else
            AD_JSON="$(oci iam availability-domain list --compartment-id "$OCI_V7_COMPARTMENT" --all --output json)"
            mapfile -t ADS < <(jq -r '.data[].name' <<<"$AD_JSON")
            INSTANCE=''
            for SHAPE in VM.Standard.E2.1.Micro VM.Standard.A1.Flex; do
              IMAGE="$(oci compute image list --compartment-id "$OCI_V7_COMPARTMENT" --operating-system 'Canonical Ubuntu' --operating-system-version '24.04' --shape "$SHAPE" --sort-by TIMECREATED --sort-order DESC --all --output json | jq -r '.data[0].id // empty')"
              [ -n "$IMAGE" ] || continue
              for AD in "${ADS[@]}"; do
                echo "Attempting relay launch shape=$SHAPE ad=$AD"
                set +e
                if [ "$SHAPE" = VM.Standard.A1.Flex ]; then
                  OUT="$(oci compute instance launch --availability-domain "$AD" --compartment-id "$OCI_V7_COMPARTMENT" --shape "$SHAPE" --shape-config '{"ocpus":1,"memoryInGBs":2}' --image-id "$IMAGE" --subnet-id "$OCI_V7_SUBNET" --assign-public-ip false --nsg-ids "[\"$OCI_V7_NSG\"]" --skip-source-dest-check true --display-name nitu-camera-v7-relay --hostname-label camera-v7-relay --user-data-file camera-v7/oracle/dedicated-relay-userdata.sh --wait-for-state RUNNING --max-wait-seconds 900 --output json 2>/tmp/launch.err)"
                else
                  OUT="$(oci compute instance launch --availability-domain "$AD" --compartment-id "$OCI_V7_COMPARTMENT" --shape "$SHAPE" --image-id "$IMAGE" --subnet-id "$OCI_V7_SUBNET" --assign-public-ip false --nsg-ids "[\"$OCI_V7_NSG\"]" --skip-source-dest-check true --display-name nitu-camera-v7-relay --hostname-label camera-v7-relay --user-data-file camera-v7/oracle/dedicated-relay-userdata.sh --wait-for-state RUNNING --max-wait-seconds 900 --output json 2>/tmp/launch.err)"
                fi
                RC=$?
                set -e
                if [ "$RC" -eq 0 ]; then
                  INSTANCE="$(jq -r '.data.id' <<<"$OUT")"
                  break 2
                fi
                tail -n 3 /tmp/launch.err || true
              done
            done
            [[ "$INSTANCE" =~ ^ocid1\.instance\. ]] || { echo 'Unable to launch dedicated relay in available shapes/ADs' >&2; exit 4; }
          fi
          echo "OCI_V7_INSTANCE=$INSTANCE" >> "$GITHUB_ENV"
          echo "CAMERA_V7_DEDICATED_INSTANCE_PASS instance=$INSTANCE"

      - name: Attach reserved public IP
        shell: bash
        run: |
          set -Eeuo pipefail
          VNIC="$(oci compute vnic-attachment list --compartment-id "$OCI_V7_COMPARTMENT" --instance-id "$OCI_V7_INSTANCE" --all --output json | jq -r '[.data[] | select(.["lifecycle-state"]=="ATTACHED")][0].["vnic-id"] // empty')"
          PRIVATE_ID="$(oci network private-ip list --vnic-id "$VNIC" --all --output json | jq -r '[.data[] | select(.["is-primary"]==true)][0].id // .data[0].id // empty')"
          [[ "$PRIVATE_ID" =~ ^ocid1\.privateip\. ]] || exit 3
          PIP="$(oci network public-ip list --scope REGION --compartment-id "$OCI_V7_COMPARTMENT" --all --output json | jq -r '[.data[] | select(.["display-name"]=="nitu-camera-v7-relay-ip")][0].id // empty')"
          if [[ ! "$PIP" =~ ^ocid1\.publicip\. ]]; then
            PIP="$(oci network public-ip create --compartment-id "$OCI_V7_COMPARTMENT" --lifetime RESERVED --display-name nitu-camera-v7-relay-ip --query data.id --raw-output)"
          fi
          oci network public-ip update --public-ip-id "$PIP" --private-ip-id "$PRIVATE_ID" --force >/dev/null
          PUBLIC_IP="$(oci network public-ip get --public-ip-id "$PIP" --query 'data."ip-address"' --raw-output)"
          [[ "$PUBLIC_IP" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 3
          echo "OCI_V7_PUBLIC_IP=$PUBLIC_IP" >> "$GITHUB_ENV"
          echo "OCI_V7_RELAY_VNIC=$VNIC" >> "$GITHUB_ENV"
          echo "CAMERA_V7_RESERVED_IP_PASS public_ip=$PUBLIC_IP"

      - name: Wait for cloud-init and obtain relay public key from console
        shell: bash
        run: |
          set -Eeuo pipefail
          RELAY_PUB=''
          for attempt in $(seq 1 45); do
            set +e
            HIST="$(oci compute console-history capture --instance-id "$OCI_V7_INSTANCE" --wait-for-state SUCCEEDED --max-wait-seconds 120 --query data.id --raw-output 2>/tmp/history.err)"
            RC=$?
            set -e
            if [ "$RC" -eq 0 ] && [[ "$HIST" =~ ^ocid1\.consolehistory\. ]]; then
              oci compute console-history get-content --instance-console-history-id "$HIST" --file /tmp/v7-console.log
              RELAY_PUB="$(sed -n 's/^CAMERA_V7_RELAY_PUBLIC_KEY=//p' /tmp/v7-console.log | tail -1 | tr -d '\r')"
              if grep -Fq 'CAMERA_V7_RELAY_READY=1' /tmp/v7-console.log && [ "${#RELAY_PUB}" -eq 44 ]; then
                break
              fi
            else
              tail -n 2 /tmp/history.err || true
            fi
            echo "Waiting for dedicated relay cloud-init attempt=$attempt"
            sleep 15
          done
          [ "${#RELAY_PUB}" -eq 44 ] || { echo 'Relay public key was not found in console history' >&2; tail -n 80 /tmp/v7-console.log 2>/dev/null || true; exit 5; }
          echo "OCI_V7_RELAY_PUBLIC_KEY=$RELAY_PUB" >> "$GITHUB_ENV"
          echo "CAMERA_V7_RELAY_PUBLIC_KEY=$RELAY_PUB"
          echo CAMERA_V7_CLOUDINIT_PASS

      - name: Remove obsolete V7 NSG from WhatsApp VNIC
        shell: bash
        run: |
          set -Eeuo pipefail
          OLD="$(oci network nsg list --compartment-id "$OCI_V7_COMPARTMENT" --vcn-id "$OCI_V7_VCN" --all --output json | jq -r '[.data[] | select(.["display-name"]=="nitu-camera-v7-relay")][0].id // empty')"
          if [[ "$OLD" =~ ^ocid1\.networksecuritygroup\. ]]; then
            VNIC_JSON="$(oci network vnic get --vnic-id "$OCI_V7_BASE_VNIC" --output json)"
            NSGS="$(jq -c --arg old "$OLD" '(.data.["nsg-ids"] // []) | map(select(. != $old))' <<<"$VNIC_JSON")"
            oci network vnic update --vnic-id "$OCI_V7_BASE_VNIC" --nsg-ids "$NSGS" --force >/dev/null
          fi
          echo CAMERA_V7_WAHA_EXPOSURE_CLEANUP_PASS

      - name: Publish relay handoff
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "CAMERA_V7_RELAY_PUBLIC_IP=$OCI_V7_PUBLIC_IP"
          echo "CAMERA_V7_RELAY_PHONE_ENDPOINT=$OCI_V7_PUBLIC_IP:51828"
          echo "CAMERA_V7_RELAY_OUTER_ENDPOINT=$OCI_V7_PUBLIC_IP:51829"
          echo "CAMERA_V7_RELAY_PUBLIC_KEY=$OCI_V7_RELAY_PUBLIC_KEY"
          echo CAMERA_V7_DEDICATED_RELAY_PASS
          {
            echo '## Camera360 V7 dedicated relay'
            echo "- Public IP: $OCI_V7_PUBLIC_IP"
            echo '- Android endpoint: UDP 51828'
            echo '- Wipro outer endpoint: UDP 51829'
            echo "- Relay public key: \`$OCI_V7_RELAY_PUBLIC_KEY\`"
            echo '- Relay private key exists only on the dedicated Oracle VM.'
          } >> "$GITHUB_STEP_SUMMARY"
