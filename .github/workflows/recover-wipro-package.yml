name: Recover Wipro MCP package sources

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-wipro-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current publication
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: current
      - name: Checkout last complete v0.2.2 publication
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: 576353f5ddbff31870515b7bbb0558bd4dc4eafd
          path: old
      - name: Recover packages
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/recovery/v022 /tmp/recovery/v024-salvaged
          cd old/deploy/wipro-mcp
          cat bundle.part.* > /tmp/v022.b64
          base64 -d /tmp/v022.b64 > /tmp/v022.zip
          echo "$(tr -d '[:space:]' < BUNDLE.sha256)  /tmp/v022.zip" | sha256sum -c -
          unzip -q /tmp/v022.zip -d /tmp/recovery/v022
          cd "$GITHUB_WORKSPACE/current/deploy/wipro-mcp"
          cat bundle.part.* > /tmp/v024.b64
          base64 -d /tmp/v024.b64 > /tmp/v024-corrupt.zip
          set +e
          zip -FF /tmp/v024-corrupt.zip --out /tmp/v024-fixed.zip </dev/null >/tmp/zipff.log 2>&1
          zrc=$?
          set -e
          cat /tmp/zipff.log
          echo ZIP_FF_RC=$zrc
          if [ -s /tmp/v024-fixed.zip ]; then
            unzip -l /tmp/v024-fixed.zip || true
            unzip -o /tmp/v024-fixed.zip -d /tmp/recovery/v024-salvaged || true
          fi
          echo '--- v022 files ---'
          find /tmp/recovery/v022 -maxdepth 2 -type f -printf '%P %s\n' | sort
          echo '--- v024 salvaged files ---'
          find /tmp/recovery/v024-salvaged -maxdepth 2 -type f -printf '%P %s\n' | sort
          cp /tmp/v024-corrupt.zip /tmp/recovery/
          [ ! -s /tmp/v024-fixed.zip ] || cp /tmp/v024-fixed.zip /tmp/recovery/
          cp /tmp/zipff.log /tmp/recovery/
      - name: Upload recovery artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wipro-package-recovery
          path: /tmp/recovery
          if-no-files-found: error
          retention-days: 1
