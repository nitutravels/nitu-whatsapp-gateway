name: Validate Wipro MCP bundle

on:
  pull_request:
    paths:
      - 'deploy/wipro-mcp/**'
      - '.github/workflows/validate-wipro-mcp.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/wipro-mcp/**'
      - '.github/workflows/validate-wipro-mcp.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Reconstruct and verify outer bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          cd deploy/wipro-mcp
          test "$(cat VERSION)" = "0.2.5"
          test "$(cat AUTO_DEPLOY)" = "ENABLED"
          read -r req_version req_sha < DEPLOY_REQUEST
          test "$req_version" = "0.2.5"
          expected="$(tr -d '[:space:]' < BUNDLE.sha256)"
          test "$req_sha" = "$expected"
          cat bundle.part.* > /tmp/nitu-mcp-bundle.b64
          base64 -d /tmp/nitu-mcp-bundle.b64 > /tmp/nitu-mcp-bundle.zip
          echo "$expected  /tmp/nitu-mcp-bundle.zip" | sha256sum -c -
          unzip -t /tmp/nitu-mcp-bundle.zip
          echo GITHUB_CI_V025_OUTER_BUNDLE_PASS

      - name: Reject unsafe ZIP entries and extract
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/nitu-mcp-package
          mkdir /tmp/nitu-mcp-package
          python3 - <<'PY'
          import pathlib, zipfile
          zpath='/tmp/nitu-mcp-bundle.zip'; dest='/tmp/nitu-mcp-package'
          with zipfile.ZipFile(zpath) as z:
              for i in z.infolist():
                  p=pathlib.PurePosixPath(i.filename)
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit(f'unsafe ZIP path: {i.filename}')
                  if ((i.external_attr >> 16) & 0o170000) == 0o120000:
                      raise SystemExit(f'ZIP symlink refused: {i.filename}')
              bad=z.testzip()
              if bad: raise SystemExit(f'ZIP CRC failure: {bad}')
              z.extractall(dest)
          PY
          test -z "$(find /tmp/nitu-mcp-package -type l -print -quit)"

      - name: Verify inner manifest and static policy
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/nitu-mcp-package
          sha256sum -c SHA256SUMS.txt
          python3 validate_package.py
          bash -n deploy_local.sh
          bash -n bootstrap_wipro.sh
          bash -n bootstrap_github_runner_once.sh
          bash -n nitu-mcp-github-sync
          bash -n nitu-mcp-spawn-watch

      - name: Install pinned runtime and boot staged gateway
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/nitu-mcp-package
          rm -rf /tmp/nitu-mcp-ci-venv /tmp/nitu-mcp-ci-state
          python3 -m venv /tmp/nitu-mcp-ci-venv
          /tmp/nitu-mcp-ci-venv/bin/pip install --disable-pip-version-check --no-input -r requirements.txt
          /tmp/nitu-mcp-ci-venv/bin/pip check
          NITU_MCP_ETC=/tmp/nitu-mcp-package NITU_MCP_STATE=/tmp/nitu-mcp-ci-state \
            /tmp/nitu-mcp-ci-venv/bin/python - <<'PY'
          import importlib.metadata as m, gateway
          assert gateway.VERSION == '0.2.5'
          assert m.version('mcp') == '2.0.0'
          assert m.version('uvicorn') == '0.35.0'
          assert m.version('httpx2') == '2.12.0'
          print('GITHUB_CI_GATEWAY_REAL_RUNTIME_IMPORT_PASS')
          PY
          cp nitu-mcp-gateway.service /tmp/nitu-mcp-source-ci.service
          sed -i \
            -e 's/^User=nitu-mcp$/User=root/' \
            -e 's/^Group=nitu-mcp$/Group=root/' \
            -e 's|^WorkingDirectory=/opt/nitu-mcp$|WorkingDirectory=/tmp/nitu-mcp-package|' \
            -e 's|^ExecStart=/opt/nitu-mcp/venv/bin/uvicorn|ExecStart=/tmp/nitu-mcp-ci-venv/bin/uvicorn|' \
            /tmp/nitu-mcp-source-ci.service
          SYSTEMD_LOG_COLOR=0 SYSTEMD_PAGER=cat systemd-analyze verify /tmp/nitu-mcp-source-ci.service
          NITU_MCP_ETC=/tmp/nitu-mcp-package NITU_MCP_STATE=/tmp/nitu-mcp-ci-state \
            /tmp/nitu-mcp-ci-venv/bin/uvicorn gateway:app --host 127.0.0.1 --port 18780 --workers 1 --no-access-log \
            >/tmp/nitu-mcp-ci-uvicorn.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true; wait $pid 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18780/healthz >/tmp/nitu-mcp-ci-health.json 2>/dev/null; then ready=1; break; fi
            kill -0 $pid 2>/dev/null || break
            sleep 0.5
          done
          if [ "$ready" != 1 ]; then cat /tmp/nitu-mcp-ci-uvicorn.log >&2; exit 1; fi
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/nitu-mcp-ci-health.json'))
          assert j['ok'] is True and j['version']=='0.2.5' and j['mode']=='read_only', j
          print('GITHUB_CI_GATEWAY_UVICORN_HEALTH_PASS')
          PY
          NITU_MCP_ETC=/tmp/nitu-mcp-package NITU_MCP_STATE=/tmp/nitu-mcp-ci-state \
            /tmp/nitu-mcp-ci-venv/bin/python - <<'PY'
          import asyncio
          from mcp import Client
          expected={
              'system_health','policy_current','upstream_status','project_current_baseline',
              'whatsapp_recent_messages','fleet_list_vehicles','fleet_vehicle_live','fleet_recent_track',
              'ads_list_accessible_customers','reports_status','oci_status'
          }
          async def main():
              async with Client('http://127.0.0.1:18780/mcp', mode='auto') as c:
                  r=await c.list_tools(); names={t.name for t in r.tools}
                  assert names==expected, names
                  out=await c.call_tool('project_current_baseline', {})
                  assert out is not None
                  print('GITHUB_CI_MCP_PROTOCOL_AND_BASELINE_PASS')
          asyncio.run(main())
          PY
          kill $pid
          wait $pid || true
          trap - EXIT

      - name: Boot hardened source-derived systemd service and negotiate MCP
        shell: bash
        run: |
          set -Eeuo pipefail
          cleanup() {
            sudo systemctl disable --now nitu-mcp-ci.service 2>/dev/null || true
            sudo rm -f /etc/systemd/system/nitu-mcp-ci.service
            sudo systemctl daemon-reload || true
            sudo rm -rf /opt/nitu-mcp-ci /etc/nitu-mcp-ci /var/lib/nitu-mcp-ci /var/log/nitu-mcp-ci
          }
          trap cleanup EXIT
          cleanup
          sudo useradd --system --home /var/lib/nitu-mcp-ci --shell /usr/sbin/nologin nitu-mcp-ci 2>/dev/null || true
          sudo install -d -m 0750 -o root -g nitu-mcp-ci /opt/nitu-mcp-ci /etc/nitu-mcp-ci
          sudo install -d -m 0750 -o nitu-mcp-ci -g nitu-mcp-ci /var/lib/nitu-mcp-ci /var/log/nitu-mcp-ci
          sudo cp /tmp/nitu-mcp-package/gateway.py /opt/nitu-mcp-ci/gateway.py
          sudo cp /tmp/nitu-mcp-package/policy.json /etc/nitu-mcp-ci/policy.json
          sudo cp /tmp/nitu-mcp-package/registry.json /etc/nitu-mcp-ci/registry.json
          sudo cp /tmp/nitu-mcp-package/PROJECT_BASELINE.json /etc/nitu-mcp-ci/PROJECT_BASELINE.json
          sudo chown root:nitu-mcp-ci /opt/nitu-mcp-ci/gateway.py /etc/nitu-mcp-ci/*.json
          sudo chmod 0640 /etc/nitu-mcp-ci/*.json
          sudo python3 -m venv /opt/nitu-mcp-ci/venv
          sudo /opt/nitu-mcp-ci/venv/bin/pip install --disable-pip-version-check --no-input -r /tmp/nitu-mcp-package/requirements.txt
          sudo /opt/nitu-mcp-ci/venv/bin/pip check
          sudo chown -R root:nitu-mcp-ci /opt/nitu-mcp-ci
          sudo chmod 0750 /opt/nitu-mcp-ci
          cp /tmp/nitu-mcp-package/nitu-mcp-gateway.service /tmp/nitu-mcp-ci.service
          sed -i \
            -e 's/Nitu MCP Control Plane Gateway v0.2.5/Nitu MCP CI hardened source-derived service v0.2.5/' \
            -e 's/User=nitu-mcp/User=nitu-mcp-ci/' \
            -e 's/Group=nitu-mcp/Group=nitu-mcp-ci/' \
            -e 's|WorkingDirectory=/opt/nitu-mcp|WorkingDirectory=/opt/nitu-mcp-ci|' \
            -e 's|NITU_MCP_ETC=/etc/nitu-mcp|NITU_MCP_ETC=/etc/nitu-mcp-ci|' \
            -e 's|NITU_MCP_STATE=/var/lib/nitu-mcp|NITU_MCP_STATE=/var/lib/nitu-mcp-ci|' \
            -e 's|ExecStart=/opt/nitu-mcp/venv/bin/uvicorn|ExecStart=/opt/nitu-mcp-ci/venv/bin/uvicorn|' \
            -e 's|--port 8780|--port 18781|' \
            -e 's|ReadWritePaths=/var/lib/nitu-mcp /var/log/nitu-mcp|ReadWritePaths=/var/lib/nitu-mcp-ci /var/log/nitu-mcp-ci|' \
            /tmp/nitu-mcp-ci.service
          sudo systemd-analyze verify /tmp/nitu-mcp-ci.service
          sudo cp /tmp/nitu-mcp-ci.service /etc/systemd/system/nitu-mcp-ci.service
          sudo systemctl daemon-reload
          sudo systemctl start nitu-mcp-ci.service
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18781/healthz >/tmp/nitu-mcp-ci-systemd-health.json 2>/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            sudo systemctl status nitu-mcp-ci.service --no-pager -l || true
            sudo journalctl -u nitu-mcp-ci.service --no-pager -n 200 || true
            exit 1
          fi
          cd /opt/nitu-mcp-ci
          sudo -u nitu-mcp-ci NITU_MCP_ETC=/etc/nitu-mcp-ci NITU_MCP_STATE=/var/lib/nitu-mcp-ci \
            /opt/nitu-mcp-ci/venv/bin/python - <<'PY'
          import asyncio
          from mcp import Client
          expected={
              'system_health','policy_current','upstream_status','project_current_baseline',
              'whatsapp_recent_messages','fleet_list_vehicles','fleet_vehicle_live','fleet_recent_track',
              'ads_list_accessible_customers','reports_status','oci_status'
          }
          async def main():
              async with Client('http://127.0.0.1:18781/mcp', mode='auto') as c:
                  r=await c.list_tools(); names={t.name for t in r.tools}
                  assert names==expected, names
                  print('GITHUB_CI_HARDENED_SYSTEMD_MCP_PROTOCOL_PASS')
          asyncio.run(main())
          PY
          sudo systemctl is-active --quiet nitu-mcp-ci.service
          echo GITHUB_CI_HARDENED_SYSTEMD_SERVICE_PASS
