name: Finalize NAMS candidate independently of Cloud Shell
run-name: NAMS candidate finalizer ${{ github.run_number }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nams-candidate-finalizer.yml'
      - 'nams-e2-micro/github-finalize-candidate.sh'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  OCI_REGION: ${{ vars.OCI_REGION || 'ap-mumbai-1' }}
  NAMS_CANDIDATE_NAME: NAMS-Lightpanda-Agent-Candidate
  NAMS_SOURCE_NAME: instance-20260723-2200
  NAMS_DOMAIN: seo.nitutravels.in

jobs:
  finalize:
    name: Check once, finalize only after full verification
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12

    steps:
      - name: Checkout operations repository
        uses: actions/checkout@v4

      - name: Validate required OCI credentials
        shell: bash
        env:
          OCI_PRIVATE_KEY_PEM: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_FINGERPRINT_VALUE: ${{ secrets.OCI_FINGERPRINT }}
          OCI_USER_VALUE: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_VALUE: ${{ secrets.OCI_TENANCY_OCID }}
        run: |
          set -Eeuo pipefail
          [ -n "$OCI_PRIVATE_KEY_PEM" ]
          [ -n "$OCI_FINGERPRINT_VALUE" ]
          [[ "$OCI_USER_VALUE" == ocid1.user.* ]]
          [[ "$OCI_TENANCY_VALUE" == ocid1.tenancy.* ]]

      - name: Configure OCI CLI
        shell: bash
        env:
          OCI_PRIVATE_KEY_PEM: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_FINGERPRINT_VALUE: ${{ secrets.OCI_FINGERPRINT }}
          OCI_USER_VALUE: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_VALUE: ${{ secrets.OCI_TENANCY_OCID }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$HOME/.oci"
          python3 - <<'PY'
          import os
          from pathlib import Path
          value=os.environ['OCI_PRIVATE_KEY_PEM'].strip()
          if len(value)>=2 and value[0]==value[-1] and value[0] in {'"',"'"}:
              value=value[1:-1]
          if '\\n' in value and '\n' not in value:
              value=value.replace('\\r','').replace('\\n','\n')
          Path.home().joinpath('.oci/key.pem').write_text(value.replace('\r','').strip()+'\n')
          PY
          chmod 600 "$HOME/.oci/key.pem"
          cat >"$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=$OCI_USER_VALUE
          fingerprint=$(printf '%s' "$OCI_FINGERPRINT_VALUE" | tr -d '[:space:]')
          tenancy=$OCI_TENANCY_VALUE
          region=$OCI_REGION
          key_file=$HOME/.oci/key.pem
          EOF
          chmod 600 "$HOME/.oci/config"
          pipx install --quiet oci-cli
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"

      - name: Verify OCI identity
        shell: bash
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
        run: |
          set -Eeuo pipefail
          oci iam region-subscription list --region "$OCI_REGION" --tenancy-id "$OCI_TENANCY_OCID" --all >/dev/null

      - name: Check and finalize existing NAMS candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x nams-e2-micro/github-finalize-candidate.sh
          NAMS_STATUS_FILE="status/nams-candidate-finalizer.json" nams-e2-micro/github-finalize-candidate.sh
          cat status/nams-candidate-finalizer.json

      - name: Persist current status in repository
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          [ -f status/nams-candidate-finalizer.json ] || exit 0
          git config user.name "nams-finalizer[bot]"
          git config user.email "nams-finalizer[bot]@users.noreply.github.com"
          git add status/nams-candidate-finalizer.json
          if git diff --cached --quiet; then
            echo "No status change to commit."
          else
            git commit -m "Update NAMS candidate finalizer status [skip ci]"
            git push
          fi

      - name: Upload current status
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nams-candidate-finalizer-${{ github.run_number }}
          path: status/nams-candidate-finalizer.json
          if-no-files-found: warn
          retention-days: 14
