name: nams-a1-quality

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "4"

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [nams]
    logging: *logging

  app:
    build:
      context: ./app
    image: nams-a1-app:local
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_OPTIONS: --max-old-space-size=768
    volumes:
      - ./data/app:/app/data
      - ./config:/app/config:ro
      - ./assets:/app/assets
    depends_on:
      chromium:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 60s
    networks: [nams]
    logging: *logging

  chromium:
    build:
      context: ./chromium
    image: nams-a1-chromium:local
    restart: unless-stopped
    shm_size: 1gb
    volumes:
      - ./data/chromium:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9223/json/version >/dev/null && curl -fsS http://127.0.0.1:6080/vnc.html >/dev/null"]
      interval: 15s
      timeout: 8s
      retries: 40
      start_period: 60s
    networks: [nams]
    logging: *logging

  ollama:
    image: ollama/ollama:0.11.4
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "4"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    networks: [nams]
    logging: *logging

  model-loader:
    image: ollama/ollama:0.11.4
    restart: "no"
    env_file: .env
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list >/tmp/models 2>/dev/null; do sleep 4; done
        if ! grep -q "^$${OLLAMA_MODEL}[[:space:]]" /tmp/models; then
          ollama pull "$${OLLAMA_MODEL}"
        fi
        ollama list
    depends_on:
      ollama:
        condition: service_started
    networks: [nams]
    logging: *logging

networks:
  nams:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  ollama_data:
